<template>
    <lightning-card title="Check-in queue — mass update, one GraphQL request" icon-name="standard:record_update">
        <div class="slds-var-p-horizontal_medium">
            <p class="slds-var-p-bottom_small slds-text-color_weak">
                The morning rush: tick &quot;Checked In&quot; (and fix emails) inline, then Save —
                every edited row becomes an aliased <code>ContactUpdate</code> operation inside a
                single mutation document, with <code>allOrNone: false</code>.
            </p>

            <template lwc:if={lastRequestSummary}>
                <lightning-badge label={lastRequestSummary} class="slds-var-m-bottom_small"></lightning-badge>
            </template>

            <template lwc:if={errorMessages}>
                <template for:each={errorMessages} for:item="error">
                    <div key={error.id} class="slds-text-color_error slds-var-p-around_x-small">
                        {error.message}
                    </div>
                </template>
            </template>

            <template lwc:if={attendees}>
                <lightning-datatable
                    key-field="Id"
                    data={attendees}
                    columns={columns}
                    draft-values={draftValues}
                    onsave={handleSave}
                    hide-checkbox-column
                ></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
