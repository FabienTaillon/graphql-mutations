<template>
    <lightning-card title="Walk-in registration — ContactCreate, zero Apex" icon-name="standard:contact">
        <div class="slds-var-p-horizontal_medium">
            <lightning-layout multiple-rows>
                <lightning-layout-item size="6" padding="around-small">
                    <lightning-input
                        label="First Name"
                        data-field="firstName"
                        value={firstName}
                        onchange={handleChange}
                    ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6" padding="around-small">
                    <lightning-input
                        label="Last Name"
                        data-field="lastName"
                        value={lastName}
                        required
                        onchange={handleChange}
                    ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6" padding="around-small">
                    <lightning-input
                        type="email"
                        label="Email"
                        data-field="email"
                        value={email}
                        onchange={handleChange}
                    ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6" padding="around-small">
                    <lightning-combobox
                        label="Badge Type"
                        data-field="badgeType"
                        value={badgeType}
                        options={badgeOptions}
                        onchange={handleChange}
                    ></lightning-combobox>
                </lightning-layout-item>
            </lightning-layout>

            <div class="slds-var-p-around_small">
                <lightning-button
                    variant="brand"
                    label="Register attendee"
                    onclick={handleRegister}
                    disabled={isLoading}
                ></lightning-button>
            </div>

            <template lwc:if={errorMessages}>
                <template for:each={errorMessages} for:item="error">
                    <div key={error.id} class="slds-text-color_error slds-var-p-around_x-small">
                        {error.message}
                    </div>
                </template>
            </template>

            <template lwc:if={attendees}>
                <div class="slds-text-title_caps slds-var-p-vertical_small">
                    Latest registrations (GraphQL query wire)
                </div>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={attendees} for:item="attendee">
                        <li key={attendee.Id} class="slds-item">
                            <strong>{attendee.Name}</strong>
                            <lightning-badge
                                label={attendee.BadgeType}
                                class="slds-var-m-left_small"
                            ></lightning-badge>
                            <span class="slds-var-p-left_small slds-text-color_weak">
                                {attendee.Email}
                            </span>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </lightning-card>
</template>
