<template>
    <lightning-card title="Sponsor VIP upgrade — Account + Contacts, across sObjects" icon-name="standard:related_list">
        <div class="slds-var-p-horizontal_medium">
            <lightning-record-picker
                label="Pick a Sponsor"
                placeholder="Search sponsor companies..."
                object-api-name="Account"
                onchange={handleAccountChange}
            ></lightning-record-picker>

            <template lwc:if={errorMessages}>
                <template for:each={errorMessages} for:item="error">
                    <div key={error.id} class="slds-text-color_error slds-var-p-around_x-small">
                        {error.message}
                    </div>
                </template>
            </template>

            <template lwc:if={hasSelection}>
                <div class="slds-var-p-vertical_small">
                    <p>
                        <strong>{account.Name}</strong> — Sponsor Tier:
                        <lightning-badge label={account.SponsorTier}></lightning-badge>
                    </p>
                </div>

                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={contacts} for:item="contact">
                        <li key={contact.Id} class="slds-item">
                            {contact.Name}
                            <lightning-badge
                                label={contact.BadgeType}
                                class="slds-var-m-left_small"
                            ></lightning-badge>
                        </li>
                    </template>
                </ul>

                <div class="slds-var-p-vertical_small">
                    <lightning-button
                        variant="brand"
                        label="Upgrade to Gold (sponsor + all badges, 1 request)"
                        onclick={handleUpgradeToGold}
                    ></lightning-button>
                </div>
                <p class="slds-text-color_weak">
                    The sponsor doubles its budget: tier moves to Gold and every attendee
                    badge flips to VIP in one atomic mutation across two sObject types
                    (<code>allOrNone: true</code>).
                </p>
            </template>
        </div>
    </lightning-card>
</template>
