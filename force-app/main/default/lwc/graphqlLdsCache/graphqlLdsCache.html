<template>
    <lightning-card title="Welcome screen — Lightning Data Service cache in action" icon-name="standard:data_streams">
        <div class="slds-var-p-horizontal_medium">
            <lightning-record-picker
                label="Find an attendee"
                placeholder="Search attendees..."
                object-api-name="Contact"
                onchange={handleContactChange}
            ></lightning-record-picker>

            <template lwc:if={errorMessages}>
                <template for:each={errorMessages} for:item="error">
                    <div key={error.id} class="slds-text-color_error slds-var-p-around_x-small">
                        {error.message}
                    </div>
                </template>
            </template>

            <template lwc:if={contactId}>
                <lightning-layout multiple-rows class="slds-var-p-top_small">
                    <lightning-layout-item size="6" padding="around-small">
                        <div class="slds-box slds-box_small">
                            <div class="slds-text-title_caps slds-var-p-bottom_small">
                                Welcome screen (standard form, LDS subscriber)
                            </div>
                            <lightning-record-view-form
                                record-id={contactId}
                                object-api-name="Contact"
                            >
                                <lightning-output-field field-name="Name"></lightning-output-field>
                                <lightning-output-field field-name="Badge_Type__c"></lightning-output-field>
                                <lightning-output-field field-name="Checked_In__c"></lightning-output-field>
                            </lightning-record-view-form>
                        </div>
                    </lightning-layout-item>

                    <lightning-layout-item size="6" padding="around-small">
                        <div class="slds-box slds-box_small">
                            <div class="slds-text-title_caps slds-var-p-bottom_small">
                                Check-in desk (GraphQL mutation, no refresh code)
                            </div>
                            <lightning-combobox
                                label="Badge Type"
                                value={badgeType}
                                options={badgeOptions}
                                onchange={handleBadgeChange}
                            ></lightning-combobox>
                            <div class="slds-var-p-top_small">
                                <lightning-button
                                    variant="brand"
                                    label="Check in via executeMutation"
                                    onclick={handleCheckIn}
                                ></lightning-button>
                            </div>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
        </div>
    </lightning-card>
</template>
